/* Concept: a printed city in one blue. White hatched buildings, a black rider with a red star head,
   sticker-cut pops with hard black shadows. Single look by choice: the scene is always this blue. */
:root {
  --bg: #1f4f9c;
  --bg-deep: #1a4590;
  --frame: #0c1730;
  --paper: #f3f5f7;
  --ink: #0d0d12;
  --red: #ef1c24;
  --wheel: #e8262e;
  --hub: #d9dde2;
  --pop-blue: #3a3cf0;
  --pop-green: #24dd96;
  --pop-yellow: #ffe500;
  --ob-yellow: #ffd60a;
  --ob-pink: #ff8fc0;
  --ob-purple: #8b5cf6;
  --ob-green: #24dd96;
  --ob-orange: #ff7a1a;
  --ob-cyan: #5fe0ff;
  --font-display: "Array", "Array Wide", "Arial Black", system-ui, sans-serif;
  --font-wide: "Array Wide", "Array", "Arial Black", system-ui, sans-serif;
  --font-body: "Khand", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; }
body {
  background: var(--frame); color: var(--paper); font-family: var(--font-body); font-weight: 500;
  display: flex; justify-content: center; align-items: center;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
/* Phone-shaped stage: 9:16, as tall as the screen allows. On a real phone it fills the screen. */
#stage { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; background: var(--bg); }
@media (min-width: 600px) and (min-height: 600px) {
  #stage { height: min(100%, 860px); border-radius: 28px; box-shadow: 0 0 0 1px rgba(243,245,247,.12), 0 24px 80px rgba(0,0,0,.55); }
}
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  pointer-events: none; font-variant-numeric: tabular-nums;
  text-shadow: 2px 2px 0 var(--ink);
}
.hud b { display: block; margin-top: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .01em; text-transform: none; }
.hud .right { text-align: right; }

.panel {
  position: absolute; left: 0; right: 0; top: 23%; transform: translateY(-50%);
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  text-align: center; pointer-events: none;
}
.panel h1 {

      if (game.buffer > 0) { game.buffer = 0; startLoad(); }
    }
  }

  function update(dt) {
    game.t += dt;
    if (game.running) {
      game.runTime += dt;
      var target = (300 + Math.min(game.runTime * 5.5, 360)) * S;
      game.v += (target - game.v) * Math.min(1, dt * 2);
    } else if (game.bailing) {
      game.v = Math.max(0, game.v - game.v * 6 * dt);
      game.bailT += dt;
      if (game.bailT > 0.55 && panel.hidden) setPanel('over');
    } else {
      game.v = 60 * S;
    }

    var mv = game.v * dt, px = PX();
    game.dist += mv / S;
    if (!game.bailing && !game.grind) game.wheelAng += mv / (10 * S);
    if (game.running) game.runDist += mv / S;
    if (game.bailing && game.bb) updateBailBoard(dt, mv);

    if (game.loadT > 0 && game.running) {
      game.loadT -= dt;
      if (game.loadT <= 0) { game.loadT = 0; takeoff(); }
    }

    if (game.trick) {
      game.trick.t += dt;
      if (game.trick.t >= game.trick.dur) {
        game.trick = null;
        /* a landed-in-time flip trick is worth 10 points */
        if (game.running) { game.bonus = (game.bonus || 0) + 10; game.labels.push({ text: '+10', t: 0, pts: true }); }
      }
    }

    if (game.grind) {
      var go = game.grind;
      if (px > go.x + go.w / 2 + 4 * S) {
        Sound.grindEnd(go.type);
        game.grind = null; game.air = true; game.vy = 0; game.airT = 0.2;
      } else {
        game.jumpY = go.h;
        game.sparkT -= dt;
        if (game.sparkT <= 0) {
          game.sparkT = go.type === 'rail' ? 0.025 : 0.05;
          for (var sp = 0; sp < 2; sp++) {
            var r = Math.random();
            game.parts.push({ x: px + (sp ? 18 : -18) * S, y: GY - go.h, vx: -(60 + r * 170) * S, vy: -(50 + Math.random() * 170) * S, t: 0, life: 0.22 + Math.random() * 0.2, kind: go.type });
          }
        }
      }
    }

    if (game.air) {
      game.airT += dt;
      var prev = game.jumpY;
      game.vy -= G * S * dt;
      game.jumpY += game.vy * dt;
      if (game.vy < 0 && game.running) {
        for (var s = 0; s < game.obstacles.length; s++) {
          var so = game.obstacles[s];
          if (!so.surface) continue;
          if (px >= so.x - so.w / 2 + 4 * S && px <= so.x + so.w / 2 - 4 * S && prev >= so.h - 3 * S && game.jumpY <= so.h) {
            if (game.trick) { var ok = game.trick.t / game.trick.dur >= 0.8; game.trick = null; if (!ok) { bail(); break; } }
            game.jumpY = so.h; game.vy = 0; game.air = false; game.grind = so; game.landT = 0.1; game.sparkT = 0;
            spawnPop('land', px + 8 * S, GY - so.h - 6 * S);
            Sound.land(so.type);
            Sound.grindStart(so.type);
            if (game.buffer > 0) { game.buffer = 0; startLoad(); }
            break;
          }
        }
      }
      if (game.air && game.jumpY <= 0) landOnGround();
    }
    game.buffer = Math.max(0, game.buffer - dt);
    game.landT = Math.max(0, game.landT - dt);

    for (var i = game.obstacles.length - 1; i >= 0; i--) {
      var o = game.obstacles[i];
      var rollMv = o.roll && game.running ? ROLL * S * dt : 0;
      o.x -= mv + rollMv;
      if (o.roll && game.running) o.ang -= ROLL * dt / 10;
      if (!o.passed && o.x + o.w / 2 < px - 30 * S) { o.passed = true; if (game.running) Sound.pass(o.type); }
      if (o.x + o.w / 2 < -80 * S) game.obstacles.splice(i, 1);
    }

    if (game.running) {
      game.since += mv;
      if (game.since >= game.gap) spawnObstacle();
      var gy = GY - game.jumpY;
      for (var j = 0; j < game.obstacles.length; j++) {
        var ob = game.obstacles[j];
        if (ob === game.grind) continue;
        var ox1 = ob.x - ob.w / 2 + 3 * S, ox2 = ob.x + ob.w / 2 - 3 * S, oy1 = GY - ob.h + (ob.surface ? 5 : 3) * S;
        var bw = ob.surface ? 30 : 40;
        if (hits(px - bw * S, gy - 24 * S, px + bw * S, gy, ox1, oy1, ox2, GY) ||
            hits(px - 14 * S, gy - 175 * S, px + 22 * S, gy - 29 * S, ox1, oy1, ox2, GY)) { bail(); break; }
      }
    }

    for (var k = game.pops.length - 1; k >= 0; k--) {
      var p = game.pops[k];
      p.t += dt;
      if (p.lock) p.x -= mv * 0.5;
      if (p.t >= p.dur) game.pops.splice(k, 1);
    }
    for (var q = game.parts.length - 1; q >= 0; q--) {
      var pt = game.parts[q];
      pt.t += dt; pt.x += pt.vx * dt - mv; pt.y += pt.vy * dt; pt.vy += 900 * S * dt;
      if (pt.t >= pt.life) game.parts.splice(q, 1);
    }

    for (var L = game.labels.length - 1; L >= 0; L--) { game.labels[L].t += dt; if (game.labels[L].t > 0.8) game.labels.splice(L, 1); }

    var ph = currentPhase(), tgt = POSES[ph];
    var f = 1 - Math.exp(-dt * 22);
    for (var key in pose) { pose[key][0] += (tgt[key][0] - pose[key][0]) * f; pose[key][1] += (tgt[key][1] - pose[key][1]) * f; }
    game.boardRot += ((game.bailing ? game.boardRot : BOARD_ROT[ph]) - game.boardRot) * (1 - Math.exp(-dt * 18));
    /* board turns sideways (top view) while sliding a rail or ledge; 0.12 s each way */
    var slideTarget = game.grind ? 1 : 0;
    game.slideT += Math.max(-dt / 0.12, Math.min(dt / 0.12, slideTarget - game.slideT));

    if (game.running) Sound.roll(game.air || game.grind ? 0 : Math.min(1, game.v / (660 * S)));
    else if (game.bailing) Sound.roll(bailRollLevel());
    elDist.textContent = score();
  }

  /* ---------- render ---------- */
  var CLOUDS = [[0.08, 0.15, 120, 5], [0.46, 0.09, 90, 4], [0.72, 0.21, 150, 6], [1.15, 0.13, 110, 5], [1.5, 0.23, 80, 4]];
  function drawClouds() {
    var period = W * 1.9, off = ((game.dist * S * 0.04) % period + period) % period;
    ctx.save(); ctx.strokeStyle = C.paper; ctx.globalAlpha = 0.32; ctx.lineCap = 'round'; ctx.lineWidth = 1.6 * S;
    for (var rep = 0; rep <= 1; rep++) {
      for (var i = 0; i < CLOUDS.length; i++) {
        var c = CLOUDS[i], cx = c[0] * W - off + rep * period;
        if (cx < -200 * S || cx > W + 200 * S) continue;
        ctx.beginPath();
        for (var l = 0; l < c[3]; l++) {
          var f = 1 - Math.abs(l - (c[3] - 1) / 2) / (c[3] * 0.7), len = c[2] * S * f, y = c[1] * H + l * 6 * S, sx = (l % 2) * 8 * S;
          ctx.moveTo(cx - len / 2 + sx, y); ctx.lineTo(cx + len / 2 + sx, y);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  function drawTile(t, offset) {
    var o = -(((offset % t.w) + t.w) % t.w);
    for (var x = o; x < W; x += t.w) ctx.drawImage(t.c, x, 0, t.w, t.h);
  }
  function drawPoles() {
    var P = 560 * S;
    ctx.save(); ctx.strokeStyle = C.paper; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.3 * S;
    layer(game.dist * S * 0.6, P, function (ox) {
      var top = GY - 280 * S;
      ctx.beginPath();
      ctx.moveTo(ox - 2 * S, GY); ctx.lineTo(ox - 2 * S, top);
      ctx.moveTo(ox + 2 * S, GY); ctx.lineTo(ox + 2 * S, top);
      ctx.moveTo(ox - 16 * S, top + 12 * S); ctx.lineTo(ox + 16 * S, top + 12 * S);
      ctx.moveTo(ox - 12 * S, top + 26 * S); ctx.lineTo(ox + 12 * S, top + 26 * S);
      ctx.moveTo(ox - 14 * S, top + 12 * S); ctx.quadraticCurveTo(ox + P / 2, top + 60 * S, ox + P - 14 * S, top + 12 * S);
      ctx.moveTo(ox + 14 * S, top + 12 * S); ctx.quadraticCurveTo(ox + P / 2, top + 52 * S, ox + P + 14 * S, top + 12 * S);
      ctx.moveTo(ox - 10 * S, top + 26 * S); ctx.quadraticCurveTo(ox + P / 2, top + 70 * S, ox + P - 10 * S, top + 26 * S);
      ctx.stroke();
    });
    ctx.restore();
  }
  function drawGround() {
    ctx.fillStyle = C.bgDeep; ctx.fillRect(0, GY, W, H - GY);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, GY, W, 26 * S); ctx.clip();
    ctx.strokeStyle = C.paper; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.3 * S;
    var sp = 9 * S, off = (game.dist * S) % sp;
    ctx.beginPath();
    for (var k = -off - 26 * S; k < W + 26 * S; k += sp) { ctx.moveTo(k, GY + 26 * S); ctx.lineTo(k + 26 * S, GY); }
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = C.paper;
    ctx.fillRect(0, GY - 1.5 * S, W, 3 * S);
    ctx.fillRect(0, GY + 26 * S, W, 1.2 * S);
    ctx.save(); ctx.globalAlpha = 0.28;
    layer(game.dist * S * 1.25, 96 * S, function (ox) { ctx.fillRect(ox, GY + 50 * S, 28 * S, 2 * S); ctx.fillRect(ox + 52 * S, GY + 50 * S, 8 * S, 2 * S); });
    layer(game.dist * S * 1.5, 140 * S, function (ox) { ctx.fillRect(ox, GY + 84 * S, 44 * S, 2 * S); });
    ctx.restore();
  }
  function easeOutBack(x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

  function drawPop(g, p) {
    var f = p.t / p.dur, s = easeOutBack(Math.min(1, p.t / 0.16)), alpha = 1;
    if (f > 0.62) { var q = (f - 0.62) / 0.38; s *= 1 + q * 0.12; alpha = 1 - q; }
    g.save();
    g.globalAlpha = Math.max(0, alpha);
    g.translate(p.x, p.y);
    g.rotate(p.rot + (reduceMotion ? 0 : Math.sin(p.t * 28) * 0.05 * (1 - f)));
    g.scale(s, s);
    var c = p.cfg;
    g.save(); g.translate(-6 * S, 6 * S); g.fillStyle = C.ink; burstPath(g, p.pts, c.size); g.fill(); g.restore();
    if (c.outer) {
      g.fillStyle = c.outer; burstPath(g, p.pts, c.size); g.fill();
      g.fillStyle = c.inner; burstPath(g, p.pts, c.size * 0.66); g.fill();
    } else {
      g.fillStyle = c.inner; burstPath(g, p.pts, c.size); g.fill();
    }
    g.restore();
  }

  function drawParts(g) {
    g.lineCap = 'round';
    for (var i = 0; i < game.parts.length; i++) {
      var p = game.parts[i], a = 1 - p.t / p.life;
      g.globalAlpha = Math.max(0, a);
      if (p.kind === 'rail') {
        var len = 0.03;
        g.strokeStyle = C.ink; g.lineWidth = 3 * S;
        g.beginPath(); g.moveTo(p.x - 1.5 * S, p.y + 1.5 * S); g.lineTo(p.x - p.vx * len - 1.5 * S, p.y - p.vy * len + 1.5 * S); g.stroke();
        g.strokeStyle = C.paper; g.lineWidth = 2 * S;
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * len, p.y - p.vy * len); g.stroke();
      } else {
        g.fillStyle = C.paper; g.fillRect(p.x, p.y, 3 * S, 3 * S);
      }
    }
    g.globalAlpha = 1;
  }

  /* score: one point per metre plus 10 for every flip trick */
  function score() { return Math.floor(game.runDist / 60) + (game.bonus || 0); }
  function drawLabel(g, l) {
    var p = l.t / 0.8, a = p < 0.7 ? 1 : 1 - (p - 0.7) / 0.3, rise = p * 26 * S;
    if (l.pts) {
      var px2 = PX() - 20 * S, py2 = GY - game.jumpY - 150 * S - p * 40 * S;
      g.save(); g.globalAlpha = Math.max(0, a);
      g.font = '700 ' + Math.round(34 * S) + 'px "Array", "Array Wide", "Arial Black", sans-serif'; g.textAlign = 'center';
      g.fillStyle = C.ink; g.fillText(l.text, px2 - 3 * S, py2 + 3 * S);
      g.fillStyle = C.paper; g.fillText(l.text, px2, py2);
      g.restore();
      return;
    }
    var x = PX() + 70 * S, y = GY - game.jumpY - 200 * S - rise;
    g.save(); g.globalAlpha = Math.max(0, a);
    g.font = '700 ' + Math.round(24 * S) + 'px "Array Wide", "Array", "Arial Black", sans-serif'; g.textAlign = 'center';
    g.fillStyle = C.ink; g.fillText(l.text, x - 3 * S, y + 3 * S);
    g.fillStyle = C.popYellow; g.fillText(l.text, x, y);
    g.restore();
  }

  function drawPlayer(g) {
    var px = PX(), gy = GY - game.jumpY;
    var rot = game.boardRot, rr_ = rot * 0.3, sl = game.slideT;
    var bob = !game.air && !game.bailing && !game.grind && game.loadT <= 0;
    if (!game.bailing) {
      var lift = game.air ? Math.max(0, -Math.sin(rot)) * 40 * S : 0;
      var stand = (29 - 22 * sl) * S;
      var tr = game.trick, tp = tr ? Math.min(1, tr.t / tr.dur) : 0, drop = tr ? Math.sin(tp * Math.PI) * 24 * S : 0;
      /* free position: deck centre follows the rider */
      var fx = px, fy = gy - 29 * S - lift + drop, fang = rot + (tr && tr.type === 'shove' ? Math.sin(tp * Math.PI) * 0.15 : 0);
      var rX = px, rY = gy - stand - lift, rAng = rot;
      /* ollie pop: the back foot snaps the tail down. The board pivots on its rear wheels
         until the tail strikes the ground, holds for a beat, then rises with the rider */
      var w = 0, pa = 0, baseY = GY - game.jumpY;
      if (game.loadT > 0 && !game.grind) { var lp = 1 - game.loadT / LOAD; pa = A_TOUCH * lp * lp; w = 1; }
      else if (game.air && game.popAnchor && game.airT < 0.16) { pa = A_TOUCH; w = game.airT < 0.05 ? 1 : Math.max(0, 1 - (game.airT - 0.05) / 0.11); baseY = game.popBaseY; }
      var cx = fx, cy = fy, ang = fang;
      if (w > 0) {
        var a = -pa, TX = TRUCK_X * S;
        var ox = px - TX + TX * Math.cos(a), oy = baseY + TX * Math.sin(a);
        var acx = ox + 29 * S * Math.sin(a), acy = oy - 29 * S * Math.cos(a);
        cx = fx + (acx - fx) * w; cy = fy + (acy - fy) * w; ang = fang + (a - fang) * w;
        rX = px + (acx - px) * w; rY = rY + (acy - rY) * w; rAng = rot + (a - rot) * w;
      }
      if (sl < 0.6) {
        /* side view. Turns 90 degrees (length shrinks) as it locks into a slide.
           kickflip: spins around its long axis. shove-it: spins half a turn flat. */
        var sx = Math.max(0.05, Math.cos(sl * Math.PI / 2)), sy = 1;
        if (tr && tr.type === 'kickflip') sy = Math.cos(tp * Math.PI * 2);
        if (tr && tr.type === 'shove') sx *= Math.cos(tp * Math.PI);
        if (Math.abs(sy) < 0.04) sy = sy < 0 ? -0.04 : 0.04;
        if (Math.abs(sx) < 0.04) sx = 0.04;
        g.save(); g.translate(cx, cy); g.rotate(ang); g.scale(sx, sy); g.translate(0, 29 * S);
        drawBoard(g, game.wheelAng, C.ink, false);
        g.restore();
      } else {
        /* end view: board across the rail or ledge, truck hanging below */
        g.save(); g.translate(px, gy); g.scale(0.5 + (sl - 0.6) / 0.4 * 0.5, 1);
        drawBoardEnd(g);
        g.restore();
      }
      var rr2 = rAng * 0.3;
      g.save(); g.translate(rX, rY); g.rotate(rr2);
      drawRider(g, pose, bob, game.t, rAng - rr2);
      g.restore();
    } else {
      var e = easeOutCubic(Math.min(1, game.bailT / 0.5));
      var bb = game.bb;
      if (bb) {
        /* the board keeps going: flips off, lands on its wheels and rolls away */
        g.save(); g.translate(bb.x, GY - bb.y - 29 * S); g.rotate(bb.ang); g.translate(0, 29 * S);
        drawBoard(g, bb.wheelAng, C.ink, false);
        g.restore();
      }
      g.save(); g.translate(px + 30 * S * e, gy); g.rotate(e * 1.45); g.translate(0, -29 * S * (1 - e * 0.7));
      drawRider(g, pose, false, game.t, 0);
      g.restore();
    }
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    drawClouds();
    drawTile(far, game.dist * S * 0.15);
    drawTile(near, game.dist * S * 0.35);
    drawPoles();
    drawGround();

    /* ink layer: everything printed in solid colour, then worn with specks */
    ictx.setTransform(1, 0, 0, 1, 0, 0);
    ictx.clearRect(0, 0, ink.width, ink.height);
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < game.obstacles.length; i++) {
      var o = game.obstacles[i];
      ictx.save(); ictx.translate(o.x, GY); DRAW[o.type](ictx, o); ictx.restore();
    }
    for (var a = 0; a < game.pops.length; a++) if (game.pops[a].kind !== 'bail') drawPop(ictx, game.pops[a]);
    inkFlush();

    /* rider layer: its own texture. Moving noise on top, then a soft blur and halo */
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.clearRect(0, 0, pl.width, pl.height);
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawPlayer(pctx);
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.globalCompositeOperation = 'source-atop';
    var nx = 0, ny = 0; /* static texture: the grain stays put */
    pctx.setTransform(0.5, 0, 0, 0.5, 0, 0); pctx.fillStyle = riderNoisePat; pctx.fillRect(0, 0, pl.width * 2, pl.height * 2);
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (canFilter) {
      ctx.filter = 'blur(' + (3 * dpr) + 'px)'; ctx.globalAlpha = 0.35; ctx.drawImage(pl, 0, 0);
      ctx.filter = 'blur(' + (0.7 * dpr) + 'px)'; ctx.globalAlpha = 1; ctx.drawImage(pl, 0, 0);
      ctx.filter = 'none';
    } else {
      ctx.drawImage(pl, 0, 0);
    }

    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawParts(ictx);
    for (var b = 0; b < game.pops.length; b++) if (game.pops[b].kind === 'bail') drawPop(ictx, game.pops[b]);
    for (var lb = 0; lb < game.labels.length; lb++) drawLabel(ictx, game.labels[lb]);
    inkFlush();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = grainPat; ctx.fillRect(0, 0, cv.width, cv.height);
  }
  function inkFlush() {
    ictx.setTransform(1, 0, 0, 1, 0, 0);
    ictx.globalCompositeOperation = 'destination-out';
    ictx.fillStyle = speckPat; ictx.fillRect(0, 0, ink.width, ink.height);
    ictx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(ink, 0, 0);
    ictx.clearRect(0, 0, ink.width, ink.height);
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.033) * timeScale; last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>

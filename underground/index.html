/* Concept: a top-down transit map. Each skater is a thick rounded line drawn on a dark grid,
   glowing into soft colour fields where the lines cross. Single dark look by choice. */
:root {
  --bg: #0e0e10;
  --frame: #050506;
  --grid: rgba(255,255,255,.075);
  --cream: #f6e7dc;
  --pink: #f4b6d2;
  --orange: #ff7a2e;
  --yellow: #ffc23d;
  --blue: #3d8ee8;
  --green: #2f9a55;
  --red: #ff3a2b;
  --purple: #6a3df0;
  --star-green: #2fd35a;
  --star-blue: #1f7bff;
  --font: "Khand", "Arial Narrow", system-ui, sans-serif;
  --font-display: "Array", "Arial Black", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; }
body {
  background: var(--frame); color: var(--cream); font-family: var(--font);
  display: flex; justify-content: center; align-items: center;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; background: var(--bg); cursor: crosshair; }
@media (min-width: 600px) and (min-height: 600px) {
  #stage { height: min(100%, 860px); border-radius: 24px; box-shadow: 0 0 0 1px rgba(246,231,220,.1), 0 24px 80px rgba(0,0,0,.6); }
}
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.best {
  position: absolute; top: 0; right: 0; pointer-events: none;
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  font-size: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-align: right; font-variant-numeric: tabular-nums;
}
.best b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .02em; text-transform: none; color: var(--yellow); }
.foot {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
}
.hint { margin: 0 0 6px 4px; font-size: 19px; font-weight: 600; line-height: 1.1; letter-spacing: .02em; color: var(--yellow); text-wrap: balance; }
.hint[hidden] { display: none; }
.tilt { display: flex; align-items: center; gap: 10px; margin: 0 0 8px 4px; }
.tilt[hidden] { display: none; }
.tilt i { display: block; width: 18px; height: 32px; border: 2px solid var(--cream); border-radius: 5px; box-sizing: border-box; animation: rock 1.8s ease-in-out infinite; }
.tilt span { font-size: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

      space = dep + Math.max(sideMove, (300 - 60 * L) * S + Math.random() * 140 * S);
    } else if (r < 0.56) {

  function drawObstaclesBelow() {

        var y2 = sy(o.wy + o.len);
        ctx.fillStyle = 'rgba(246,231,220,.07)'; rr(ctx, o.x - o.w / 2, y2, o.w, y - y2, 10 * S); ctx.fill();
        ctx.strokeStyle = C.cream; ctx.lineWidth = 2 * S; rr(ctx, o.x - o.w / 2, y2, o.w, y - y2, 10 * S); ctx.stroke();
        ctx.save(); rr(ctx, o.x - o.w / 2, y2, o.w, y - y2, 10 * S); ctx.clip();
        ctx.strokeStyle = 'rgba(246,231,220,.16)'; ctx.lineWidth = 1; ctx.beginPath();
        for (var k = -o.w; k < (y - y2) + o.w; k += 5 * S) { ctx.moveTo(o.x - o.w / 2, y2 + k); ctx.lineTo(o.x + o.w / 2, y2 + k - o.w); }
        ctx.stroke(); ctx.restore();
      } else if (o.type === 'rail') {
        var r2 = sy(o.wy + o.len);
        ctx.strokeStyle = C.cream; ctx.lineWidth = 9 * S; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(o.x, y); ctx.lineTo(o.x, r2); ctx.stroke();
        ctx.fillStyle = C.bg; ctx.strokeStyle = C.cream; ctx.lineWidth = 3 * S;
        [y, r2].forEach(function (yy) { ctx.beginPath(); ctx.arc(o.x, yy, 11 * S, 0, 6.2832); ctx.fill(); ctx.stroke(); });
      }
    });
  }
  /* walls: thick striped barriers, clearly not something you can ride through */
  function drawBars() {
    game.obstacles.forEach(function (o) {
      if (o.type !== 'bar') return;
      var y = sy(o.wy), hb = (o.depth || BAR * S) / 2;
      o.segs.forEach(function (sg) {
        var x1 = Math.max(sg[0], -40), x2 = Math.min(sg[1], W + 40);
        ctx.fillStyle = C.bg; ctx.fillRect(x1 - 5 * S, y - hb - 5 * S, x2 - x1 + 10 * S, hb * 2 + 10 * S);
        ctx.fillStyle = o.color; ctx.fillRect(x1, y - hb, x2 - x1, hb * 2);
        ctx.save(); ctx.beginPath(); ctx.rect(x1, y - hb, x2 - x1, hb * 2); ctx.clip();
        ctx.strokeStyle = C.bg; ctx.lineWidth = 3.5 * S; ctx.beginPath();
        for (var k = x1 - hb * 2; k < x2 + hb * 2; k += 9 * S) { ctx.moveTo(k, y + hb); ctx.lineTo(k + hb * 2, y - hb); }
        ctx.stroke(); ctx.restore();
      });
    });
  }
  /* jump-over objects: uneven sticker stars in red, green and blue with a hard dark shadow */
  function starPath(pts, size) {
    ctx.beginPath(); ctx.moveTo(pts[0][0] * size, pts[0][1] * size);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * size, pts[i][1] * size);
    ctx.closePath();
  }
  function drawDots() {
    game.obstacles.forEach(function (o) {
      if (o.type !== 'dot') return;
      if (!o.pts) { o.pts = makeBurst(7 + Math.floor(Math.random() * 3), 0.25); o.spin = (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random() * 0.5); }
      var y = sy(o.wy);
      ctx.save(); ctx.translate(o.x, y); ctx.rotate(reduceMotion ? 0 : game.t * o.spin);
      ctx.save(); ctx.translate(3 * S, 4 * S); ctx.fillStyle = 'rgba(0,0,0,.7)'; starPath(o.pts, o.r * 1.15); ctx.fill(); ctx.restore();
      ctx.fillStyle = o.color; starPath(o.pts, o.r * 1.15); ctx.fill();
      ctx.restore();
    });
  }
  function drawTrails(air) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    boards.forEach(function (b) {
      var runs = trailRuns(b, air);
      ctx.save();
      runs.forEach(function (r) { strokeRamp(ctx, b, r, 1, boardW(b) * (air ? 1.3 : 1), true, air ? 20 * S : 0); });
      ctx.restore();
    });
  }
  /* top view of each board: deck graphic only, no wheels. The player's board is bigger with a cream edge.
     On a rail or pad the board turns 90 degrees into a slide; kickflips roll it over (showing the maple underside),
     shove-its spin it half a turn flat */
  function drawDeck(b) {
    var y = sy(b.wy), lift = b.air > 0 ? Math.sin(Math.PI * (1 - b.air / b.airDur)) : 0, sc = 1 + 0.3 * lift;
    var ang = Math.atan2(b.vx, Math.max(60 * S, game.v)) * (1 - b.slide) + b.slide * Math.PI / 2;
    if (b.player && game.state === 'over') ang += game.crashT * b.spin;
    var tr = b.trick, tp = tr ? Math.min(1, tr.t / tr.dur) : 0, flipX = 1, art = b.deck;
    if (tr && tr.type === 'shove') ang += Math.PI * (1 - Math.pow(1 - tp, 2));
    if (tr && tr.type === 'kickflip') { flipX = Math.cos(tp * Math.PI * 2); if (flipX < 0) art = DECKS.under; }
    var fx = Math.max(0.06, Math.abs(flipX));
    var dl = (b.player ? 104 : 80) * S, dw = boardW(b);
    if (lift > 0) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.ellipse(b.x + 8 * S * lift, y + 13 * S * lift, dw / 2 * fx, dl / 2, ang, 0, 6.2832); ctx.fill(); }
    ctx.save(); ctx.translate(b.x, y); ctx.rotate(ang); ctx.scale(sc * fx, sc);
    ctx.drawImage(art, -dw / 2, -dl / 2, dw, dl);
    ctx.restore();
  }
  function drawLabels() {
    game.labels.forEach(function (l) {
      var p = l.t / 0.8, a = p < 0.65 ? 1 : 1 - (p - 0.65) / 0.35;
      ctx.save(); ctx.globalAlpha = Math.max(0, a);
      ctx.font = '600 ' + Math.round(30 * S) + 'px Khand, "Arial Narrow", sans-serif'; ctx.textAlign = 'center';
      var x = clamp(l.x, 70 * S, W - 70 * S), y = HEADY - 88 * S - p * 30 * S;
      ctx.fillStyle = C.bg; ctx.fillText(l.text.toUpperCase(), x + 2 * S, y + 2 * S);
      ctx.fillStyle = l.text === 'kickflip' ? '#3d8bff' : C.red; ctx.fillText(l.text.toUpperCase(), x, y);
      ctx.restore();
    });
  }

  /* ================= shape bursts =================
     the grainy gradient shapes from the reference burst out of tricks, jumps and crashes, then fade.
     They are fixed to the ground, so they slide away behind you as you ride on */
  var SHAPE_TYPES = ['circle', 'square', 'burst', 'diamond', 'blob', 'bar', 'sparkle', 'burst'];
  var SHAPE_PALS = [['#ff1e1e', '#ffd400'], ['#ff2ea6', '#ff9de0'], ['#00d0ff', '#1f5bff'], ['#7cff00', '#13a34a'], ['#8a2be2', '#ff2ea6'], ['#ffd400', '#ff7a00'], ['#ffffff', '#7cff00'], ['#1f5bff', '#ff2ea6']];
  function spawnShapes(x, wy, n, big) {
    for (var i = 0; i < n; i++) {
      var t = SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)];
      var k = big === true ? 1.4 : (big || 1), huge = k > 2;
      var a = Math.random() * 6.2832, sp = (90 + Math.random() * 170) * S * (huge ? 1.2 : big ? 1.5 : 1);
      game.shapes.push({ type: t, x: x, wy: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 5,
        size: (t === 'sparkle' ? 14 + Math.random() * 10 : 26 + Math.random() * 32) * S * k, grow: huge ? 0.45 : 0.18,
        pal: SHAPE_PALS[Math.floor(Math.random() * SHAPE_PALS.length)], t: 0, life: huge ? 1.5 + Math.random() * 0.6 : 0.75 + Math.random() * 0.45,
        pts: t === 'burst' ? makeBurst(6 + Math.floor(Math.random() * 4), 0.35) : null });
    }
  }
  function updateShapes(dt) {
    for (var i = game.shapes.length - 1; i >= 0; i--) {
      var d = game.shapes[i], k = Math.exp(-3.2 * dt);
      d.t += dt; d.x += d.vx * dt; d.wy += d.vy * dt; d.vx *= k; d.vy *= k; d.rot += d.spin * dt; d.spin *= Math.exp(-1.5 * dt);
      if (d.t > d.life) game.shapes.splice(i, 1);
    }
  }
  function drawShapes() {
    game.shapes.forEach(function (d) {
      var p = d.t / d.life, gp = d.grow || 0.18, grow = p < gp ? 0.12 + 0.88 * (1 - Math.pow(1 - p / gp, 3)) : 1, s = d.size * grow * (1 - 0.25 * p);
      var alpha = p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4;
      ctx.save(); ctx.translate(d.x, sy(d.wy)); ctx.rotate(d.rot); ctx.globalAlpha = Math.max(0, alpha);
      if (d.type === 'sparkle') {
        ctx.fillStyle = C.cream; ctx.beginPath();
        for (var k = 0; k < 8; k++) { var a = k * Math.PI / 4, rad = k % 2 ? s * 0.16 : s; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
        ctx.closePath(); ctx.fill();
      } else {
        var gr = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2); gr.addColorStop(0, d.pal[0]); gr.addColorStop(1, d.pal[1]);
        ctx.fillStyle = gr; ctx.beginPath();
        if (d.type === 'circle') ctx.arc(0, 0, s / 2, 0, 6.2832);
        else if (d.type === 'square') ctx.rect(-s / 2, -s / 2, s, s);
        else if (d.type === 'diamond') { ctx.moveTo(0, -s * 0.55); ctx.lineTo(s * 0.32, 0); ctx.lineTo(0, s * 0.55); ctx.lineTo(-s * 0.32, 0); ctx.closePath(); }
        else if (d.type === 'bar') { if (ctx.roundRect) ctx.roundRect(-s / 2, -s * 0.13, s, s * 0.26, s * 0.13); else ctx.rect(-s / 2, -s * 0.13, s, s * 0.26); }
        else if (d.type === 'blob') { ctx.arc(-s * 0.18, -s * 0.12, s * 0.3, 0, 6.2832); ctx.moveTo(s * 0.44, s * 0.12); ctx.arc(s * 0.16, s * 0.12, s * 0.28, 0, 6.2832); }
        else { var pts = d.pts; ctx.moveTo(pts[0][0] * s * 0.6, pts[0][1] * s * 0.6); for (var j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0] * s * 0.6, pts[j][1] * s * 0.6); ctx.closePath(); }
        ctx.fill();
      }
      ctx.restore();
    });
  }
  function drawFx() {
    game.parts.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.kind === 'rail' ? C.cream : C.pink;
      ctx.fillRect(p.x, p.y, 2.5 * S, 2.5 * S);
    });
    ctx.globalAlpha = 1;
    game.rings.forEach(function (r, i) {
      if (r.t < 0) return;
      var p = r.t / 1.1; ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.strokeStyle = [C.orange, C.pink, C.yellow][i % 3]; ctx.lineWidth = (10 - 7 * p) * S;
      ctx.beginPath(); ctx.arc(r.x, r.y, (14 + 150 * (1 - Math.pow(1 - p, 3))) * S, 0, 6.2832); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    drawGrid();
    drawGlow();
    drawObstaclesBelow();
    drawTrails(false);
    drawBars();
    drawDots();
    drawTrails(true);
    crew.forEach(drawDeck);
    drawDeck(player);
    drawShapes();
    drawLabels();
    drawFx();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = grainPat; ctx.fillRect(0, 0, cv.width, cv.height);
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.033); last = now;
    update(dt); render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>
